{{ define "main" }}

<div class="container" style="padding: 6rem 1.5rem; text-align: center; max-width: 600px;">
  <div style="font-size: 5rem; font-weight: 800; color: var(--accent-primary); line-height: 1; margin-bottom: 1rem;">404</div>
  <h1 style="font-size: 2rem; font-weight: 700; margin-bottom: 1rem;">Page Not Found</h1>
  <p style="color: var(--text-secondary); font-size: 1.1rem; margin-bottom: 2rem;">
    The article or page you were looking for could not be found or has moved.
  </p>
  <div style="display: flex; gap: 1rem; justify-content: center;">
    <a href="/" class="btn-primary">Back to Blog</a>
    <a href="{{ .Site.Params.businessURL }}" class="btn-secondary" target="_blank" rel="noopener">GrowStack Main Site</a>
  </div>
</div>

{{ end }}
