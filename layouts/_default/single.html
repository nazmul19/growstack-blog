{{ define "main" }}

<article class="article-container" style="padding-top: 3rem; padding-bottom: 4rem;">
  <header style="margin-bottom: 2rem; border-bottom: 1px solid var(--border-color); padding-bottom: 1.5rem;">
    <h1 class="article-main-title">{{ .Title }}</h1>
    {{ with .Description }}
    <p class="article-subtitle">{{ . }}</p>
    {{ end }}
  </header>

  <div class="article-body">
    {{ .Content }}
  </div>
</article>

{{ end }}
